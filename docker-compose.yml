services:
  app-api:
    build:
      context: .
      dockerfile: docker/app-api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Spine-only runtime by default.
      SPINE_MODE: spine
      # In Docker/Compose, talk to the internal grobid service.
      # (Host-run dev keeps backend/settings.py default: http://localhost:8070)
      GROBID_URL: http://grobid:8070
      # Postgres (V2 ingestion spine)
      POSTGRES_DSN: postgresql://app:app@postgres:5432/app
      # S3-compatible object store (MinIO)
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      S3_BUCKET_WORKS: works
      S3_REGION: us-east-1
      S3_USE_SSL: "false"
      AWS_EC2_METADATA_DISABLED: "true"

      # Internal service auth (shared bearer token)
      INTERNAL_SERVICE_TOKEN: dev-internal-token

      # Optional OCR-capable fallback worker (Phase 09.2)
      FALLBACK_WORKER_URL: http://fallback-worker:8010
    depends_on:
      - grobid
      - postgres
      - minio
      - fallback-worker
    restart: unless-stopped
    volumes:
      - ./data:/app/data

  grobid:
    image: lfoppiano/grobid:0.8.0
    ports:
      - "8070:8070"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          sleep 1
        done
        mc mb -p "local/$${S3_BUCKET_WORKS}" || true
        mc anonymous set none "local/$${S3_BUCKET_WORKS}" || true
        mc ls local >/dev/null
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
      S3_BUCKET_WORKS: works
    restart: "no"

  app-ui:
    build:
      context: .
      dockerfile: docker/app-ui/Dockerfile
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://app-api:8000
    depends_on:
      - app-api
    volumes:
      - ./data:/app/data

  fallback-worker:
    build:
      context: .
      dockerfile: docker/fallback-worker/Dockerfile
    environment:
      POSTGRES_DSN: postgresql://app:app@postgres:5432/app
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      S3_BUCKET_WORKS: works
      S3_REGION: us-east-1
      S3_USE_SSL: "false"
      AWS_EC2_METADATA_DISABLED: "true"
      INTERNAL_SERVICE_TOKEN: dev-internal-token
      FALLBACK_OCR_LANGUAGES: eng
      FALLBACK_TEXT_MIN_CHARS: "40"
      FALLBACK_OCR_DPI_STEPS: "150,200,300"
    depends_on:
      - postgres
      - minio
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
