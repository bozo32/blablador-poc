services:
  app-api:
    build:
      context: .
      dockerfile: docker/app-api/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

  app-ui:
    build:
      context: .
      dockerfile: docker/app-ui/Dockerfile
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://app-api:8000
    depends_on:
      - app-api
    volumes:
      - ./data:/app/data
